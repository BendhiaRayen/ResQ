<header><div><strong>ResQ</strong><span>Module M4 · Aide humanitaire</span></div><span class="badge">Sprint 1 · CRUD</span></header><main><nav><button *ngFor="let k of ['volunteers','resources','shelters','missing-persons']" [class.active]="kind===k" (click)="select($any(k))">{{labels[k]}}</button></nav><section><div class="title"><div><p class="eyebrow">GESTION OPÉRATIONNELLE</p><h1>{{labels[kind]}}</h1></div><button class="primary" (click)="editing=null;form={}">+ Ajouter</button></div><form (ngSubmit)="save()"><ng-container [ngSwitch]="kind"><input *ngSwitchCase="'volunteers'" [(ngModel)]="form.name" name="name" placeholder="Nom complet" required><input *ngSwitchCase="'volunteers'" [(ngModel)]="form.email" name="email" type="email" placeholder="Email" required><input *ngSwitchCase="'volunteers'" [(ngModel)]="form.skills" name="skills" placeholder="Compétences" required><input *ngSwitchCase="'volunteers'" [(ngModel)]="form.zone" name="zone" placeholder="Zone"><input *ngSwitchCase="'resources'" [(ngModel)]="form.name" name="name" placeholder="Ressource" required><select *ngSwitchCase="'resources'" [(ngModel)]="form.type" name="type"><option value="FOOD">Nourriture</option><option value="WATER">Eau</option><option value="MEDICINE">Médicaments</option><option value="EQUIPMENT">Équipement</option></select><input *ngSwitchCase="'resources'" [(ngModel)]="form.quantity" name="quantity" type="number" placeholder="Quantité"><input *ngSwitchCase="'resources'" [(ngModel)]="form.location" name="location" placeholder="Localisation"><input *ngSwitchCase="'shelters'" [(ngModel)]="form.name" name="name" placeholder="Nom du refuge" required><input *ngSwitchCase="'shelters'" [(ngModel)]="form.location" name="location" placeholder="Localisation"><input *ngSwitchCase="'shelters'" [(ngModel)]="form.capacity" name="capacity" type="number" placeholder="Capacité"><input *ngSwitchCase="'shelters'" [(ngModel)]="form.occupied" name="occupied" type="number" placeholder="Places occupées"><input *ngSwitchCase="'missing-persons'" [(ngModel)]="form.full_name" name="full_name" placeholder="Nom complet" required><input *ngSwitchCase="'missing-persons'" [(ngModel)]="form.age" name="age" type="number" placeholder="Âge"><input *ngSwitchCase="'missing-persons'" [(ngModel)]="form.zone" name="zone" placeholder="Zone"><textarea *ngSwitchCase="'missing-persons'" [(ngModel)]="form.description" name="description" placeholder="Description"></textarea></ng-container><button class="save" type="submit">{{editing?'Enregistrer les modifications':'Créer'}}</button><button *ngIf="editing" type="button" (click)="editing=null;form={}">Annuler</button></form><div class="grid"><article *ngFor="let x of items"><div><h3>{{x.name||x.full_name}}</h3><p>{{x.zone||x.location||x.description}}</p><small *ngIf="x.skills">{{x.skills}}</small><small *ngIf="x.available_places!==undefined">{{x.available_places}} places disponibles</small><small *ngIf="x.quantity">{{x.quantity}} unités · {{x.type}}</small></div><div class="actions"><button (click)="edit(x)">Modifier</button><button class="danger" (click)="remove(x)">Supprimer</button></div></article></div></section></main>
